scoring:
  weights: { must_have: 0.40, experience: 0.20, role_type: 0.15, nice_to_have: 0.10, freshness: 0.15 }
  thresholds: { referral_first: 8, apply_direct: 6 }

discover:
  watchlist_file: data/companies.yaml
  user_agent: "job-agent/0.1 (personal job search script)"
  request_interval_s: 1.0        # min gap between requests to the same host
  http_cache_hours: 6            # re-running discover within this window reuses responses
  workday_search_terms: ["software engineer", "software developer", "machine learning", "AI engineer"]
  workday_max_pages: 5           # 20 results per page, per search term

referrals:
  keywords: ["National College of Ireland", "Anna University", "Zoho", "ManageEngine"]
  communities: ["ICAM Toulouse", "Erasmus+ BIP", "Citi Upstart"]
  max_per_company: 2            # active asks per company
  max_views_per_company: 3      # LinkedIn page views per company per run

linkedin:
  window: { start: "08:00", end: "10:30", weekdays_only: true }
  caps: { page_views: 15, requests: 10, withdrawals: 5 }
  pacing: { view_gap_s: [20, 60], settle_s: [3, 8], send_gap_s: [60, 180] }
  warmup: [3, 6]                 # requests/day in week 1 and week 2 of live sending, then caps.requests
  # Lane B sender. "dry_run" opens profiles and logs what it WOULD send. "live" really sends,
  # and is refused until there are min_dry_run_days days of completed dry runs.
  send_mode: "dry_run"
  min_dry_run_days: 5
  auto_start_chrome: true        # run-all starts scripts/start_chrome.sh if :9222 is down

gmail:
  # Senders verified 2026-11-14 with `python -m job_agent gmail-peek`:
  #   jobalerts-noreply@  = your saved job alerts
  #   jobs-noreply@       = LinkedIn's own recommendations ("jobs similar to…", "apply now to…")
  linkedin_alert_query: "from:(jobalerts-noreply@linkedin.com OR jobs-noreply@linkedin.com) newer_than:2d"
  max_messages: 50
  probe_unknown_ats: true      # guess Greenhouse/Ashby/Lever slugs for companies not in companies.yaml
  # Verified 2026-11-15: '"<Name> via LinkedIn" <invitations@linkedin.com>', subject
  # "<First> accepted your invitation, explore their network". 3d window; processed ids are remembered.
  accepted_query: "from:invitations@linkedin.com subject:\"accepted your invitation\" newer_than:3d"

llm:
  # Fact extraction: "claude" (claude -p on your Pro plan; ~3 s/job) with Ollama as
  # fallback when the usage limit is hit, or "ollama" (local, free, ~25 s/job).
  extract_engine: "claude"
  claude_model: "sonnet"
  ollama_model: "qwen2.5:14b"
  claude_cli: "claude"
