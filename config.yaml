preferences:
  # Target roles: Software Engineer, AI Engineer, ML Engineer, Backend, AI SWE (agents).
  role_types: [ai_ml, backend, fullstack]
  seniority: [junior, mid, senior]          # "senior" scored, not skipped; experience fit handles 5+ yr asks
  open_to_internships: false

  # Discover stage keeps a job only if its title matches at least one of these
  # (Python regex, case-insensitive). Seniority/intern exclusions happen later,
  # in the score stage (filters.title_exclude).
  target_titles:
    - '\bai\b.*\b(engineer|developer)\b'      # AI Engineer, AI Infrastructure Engineer
    - 'machine learning'                       # Machine Learning Engineer
    - '\bml\b'                                 # ML Engineer, ML Ops
    - 'mlops'
    - '\bapplied (ai|ml|scientist)\b'
    - '\bllm\b'
    - '\bgen(erative)?\s?ai\b'
    - 'software (engineer|developer|development)'
    - '\bswe\b'
    - '\bback[- ]?end\b'
    - '\bfull[- ]?stack\b'
    - '\b(python|java|typescript)\s+(engineer|developer)\b'
    - '\bforward[- ]deployed\b.*\bengineer'       # Forward Deployed (AI/Software) Engineer
    - '\bagentic\b.*\b(engineer|developer)\b'

  # A job passes if any location string contains one of these words...
  locations: [Dublin, Ireland, Cork, Galway, Limerick]
  # ...or it is remote AND names one of these regions. Ireland only (2026-11-14):
  # "Remote - Europe/EMEA" roles are dropped unless they also list Ireland.
  remote_regions: [Ireland]
  # A bare "Remote" with no region is usually US-only. Set true to keep those.
  accept_unqualified_remote: false
  min_salary: null

filters:
  title_exclude: [staff, principal, director, "head of", manager, intern, internship, "placement student", lead, architect]
  # JD regexes that make a job impossible → auto-skip.
  jd_exclude_patterns:
    - '\b(fluent|native|business[- ]level|proficient)\b[^.\n]{0,30}\b(german|french|dutch|spanish|italian|polish|portuguese|swedish|danish|norwegian|finnish|japanese|mandarin)\b'
    - '\b(german|french|dutch|spanish|italian|polish|portuguese|swedish|danish|norwegian|finnish|japanese|mandarin)[- ]speak(ing|er)s?\b'
    - '\bsecurity clearance\b'
    - '\b(eu|eea|irish|uk) (citizen|citizenship|passport)s? (only|is required|required)\b'
  # JD regexes that are risky on Stamp 1G but not impossible → -2 penalty + flagged.
  jd_flag_patterns:
    - '\b(not|unable to|cannot|can.t|won.t|will not)\b[^.\n]{0,40}\bsponsor'
    - '\bwithout (the need for )?(visa )?sponsorship\b'
    - '\bstamp 4\b'
  rejection_cooldown_days: 90
  # Recruiters / job aggregators: a referral there makes no sense, so these are
  # never "referral_first" (capped at apply_direct). Case-insensitive company names.
  agencies: ["Jobgether", "Joblet-AI", "Archer Recruitment", "AfterQuery Experts", "Alignerr",
             "Fruition Group Ireland", "Staffviser", "Ethos", "G2i", "Hays", "Morgan McKinley",
             "Harvey Nash", "Robert Walters", "Sthree", "Cpl", "Reperio Human Capital"]
  # Applications already made (from your history); treated as applied/rejected.
  already_applied:
    rejected: ["Anthropic|AI Reliability Engineering", "Microsoft|Windows + Devices SWE II",
               "Genesys|Agentic Orchestration", "Workday|*"]
    in_progress: ["Microsoft|Software Engineer – Agent 365", "Salesforce|AI-native Academy SWE"]
  rejection_cooldown_days: 90

