# ATS watchlist. Polled daily by `python -m job_agent discover`.
#
# Each entry needs a name plus EITHER a careers_url (ATS + slug are detected
# from it) OR explicit ats + slug. Supported careers URLs:
#   https://job-boards.greenhouse.io/<slug>      (or boards.greenhouse.io)
#   https://jobs.lever.co/<slug>                 (jobs.eu.lever.co for EU)
#   https://jobs.ashbyhq.com/<slug>
#   https://<tenant>.wd<N>.myworkdayjobs.com/<site>
#
# Optional: aliases (other names in alert emails), linkedin_slug.
# Remove an entry (or set watch: false) to stop polling it.
#
# Seeded 2026-11-14: every entry was checked live and had Ireland-based roles.

companies:
